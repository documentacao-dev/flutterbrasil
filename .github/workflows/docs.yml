name: Docs site

on:
  push:
    branches:
      - main
    paths:
      - 'sites/docs/**'
      - 'examples/**'
      - 'packages/excerpter/**'
      - 'packages/site_shared/**'
      - 'tool/dash_site/**'
      - 'tool/config/linkcheck-skip-list.txt'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/docs.yml'
  # Sem filtro `paths` no pull_request: "Build and check links" é check
  # obrigatório da main e precisa existir em todo PR. Quando o PR não mexe no
  # site, o job termina em sucesso sem buildar (passo "Detectar mudanças").
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  excerpts:
    name: Check code excerpts
    runs-on: ubuntu-latest
    if: github.repository == 'flutter/website'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b
        with:
          sdk: 3.14.0-315.3.beta
      - name: Fetch Dart dependencies
        run: dart pub get
      - name: Check if excerpts are up to date
        run: dart run dash_site --site=docs refresh-excerpts --fail-on-update --dry-run

  linkcheck:
    name: Build and check links
    runs-on: ubuntu-latest
    if: contains(fromJSON('["flutter/website", "documentacao-dev/flutterbrasil"]'), github.repository)
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Em PR, só builda se algum arquivo do site mudou (a mesma lista do
      # filtro `paths` do push). Fora disso o job passa sem fazer nada, mas
      # o check existe, então a proteção da main não trava o PR.
      - name: Detectar mudanças no site
        id: mudancas
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          arquivos=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/$PR/files" --jq '.[].filename')
          site=false
          while IFS= read -r f; do
            case "$f" in
              sites/docs/*|examples/*|packages/excerpter/*|packages/site_shared/*|\
              tool/dash_site/*|tool/config/linkcheck-skip-list.txt|\
              pubspec.yaml|pubspec.lock|analysis_options.yaml|\
              .github/workflows/docs.yml)
                site=true; break ;;
            esac
          done <<< "$arquivos"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          if [ "$site" = false ]; then
            echo "PR sem mudanças no site: build e checagem de links pulados." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.mudancas.outputs.site == 'true'
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b
        if: steps.mudancas.outputs.site == 'true'
        with:
          sdk: 3.14.0-315.3.beta
      - name: Fetch Dart dependencies
        if: steps.mudancas.outputs.site == 'true'
        run: dart pub get
      - name: Install firebase-tools
        if: steps.mudancas.outputs.site == 'true'
        # Pinned because the hosting emulator fails to
        # start with firebase-tools 15.31.0.
        # Once https://github.com/firebase/firebase-tools/issues/11168 is fixed,
        # unpin or consider an automatic rolling process.
        env:
          FIREBASE_TOOLS_VERSION: 15.30.2
        run: |
          sudo curl -sSfLo /usr/local/bin/firebase \
            "https://firebase.tools/bin/linux/v${FIREBASE_TOOLS_VERSION}"
          sudo chmod +rx /usr/local/bin/firebase
          firebase --version
      - name: Build site
        if: steps.mudancas.outputs.site == 'true'
        run: dart run dash_site --site=docs build
      - name: Check for broken Markdown link references
        if: steps.mudancas.outputs.site == 'true'
        run: dart run dash_site --site=docs check-link-references
      - name: Check for duplicate element IDs
        run: dart run dash_site --site=docs check-duplicate-ids
      - name: Check for broken internal links
        if: steps.mudancas.outputs.site == 'true'
        run: dart run dash_site --site=docs check-links

  firebase-validate:
    name: Validate Firebase configuration
    runs-on: ubuntu-latest
    if: contains(fromJSON('["flutter/website", "documentacao-dev/flutterbrasil"]'), github.repository)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b
        with:
          sdk: 3.14.0-315.3.beta
      - name: Fetch Dart dependencies
        run: dart pub get
      - name: Validate the firebase.json file
        run: dart run dash_site --site=docs verify-firebase-json
